name: PowerShell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run PowerShell scripts
      shell: pwsh
      run: |
        Write-Host "Running in PowerShell!" -ForegroundColor Green
        node -v
        npm -v
        Get-ChildItem
        
    - name: Run build with PowerShell
      shell: pwsh
      run: |
        .\build.ps1
        # or run npm scripts
        npm run build
        
    - name: Test with PowerShell
      shell: pwsh
      run: |
        .\tests.ps1
        # or run npm tests
        npm test
